[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usd-rub-prediction"
version = "0.1.0"
description = "Бесплатные исторические данные и эталонные прогнозы USD/RUB"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "pandas>=2.2,<3", "numpy>=1.26,<2.4",
  "scipy>=1.12,<2", "lxml>=5,<7", "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4", "xlrd>=2,<3", "pypdf>=5,<7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
notebook = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
    "nbclient>=0.10,<1",
]

[project.scripts]
usd-rub = "usd_rub.cli:main"

[project.optional-dependencies]
ml = [
    "catboost>=1.2.8,<2",
    "scikit-learn>=1.6,<2",
]
news = [
    "pyarrow>=17,<27",
    "torch>=2.5,<3",
    "transformers>=4.56,<6",
]
sequence = [
    "scikit-learn>=1.6,<2",
    "torch>=2.5,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/usd_rub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
